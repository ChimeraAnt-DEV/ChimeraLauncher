def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def getGitTag() {
    def tag = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        tag = stdout.toString().trim()
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
    } catch (ignored) {
    }
    return tag
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse("yyyy-MM-dd HH:mm:ss", "2025-01-01 00:00:00")
    def now = new Date()
    def diff = (now.time - baseDate.time) / 1000
    return diff.toInteger()
}

android {
    namespace 'org.chimeramc.launcher'
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.chimeramc.launcher"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode getVersionCodeByTimestamp()
        versionName getGitTag()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CURSEFORGE_API_KEY", "\"${localProperties.getProperty('curseforge.api_key', '')}\""
        // NOTE: no ndk/abiFilters here on purpose. A defaultConfig ndk block is *merged*
        // with a flavor's rather than overridden by it, so listing arm64-v8a here and
        // armeabi-v7a in the 32-bit flavor yields an APK containing BOTH. That is not a
        // harmless extra: an APK carrying any 64-bit library is installed as a 64-bit
        // process, which then refuses to load the 32-bit game libraries. Each flavor
        // therefore declares its ABI set in full and nothing is listed globally.
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
    buildFeatures {
        prefab true
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDirs += rootProject.file('resources')
        }
    }
    /*
     * One process cannot span both bitnesses, so supporting 32-bit-only Minecraft versions
     * means shipping two APKs. These flavors are built from the same source; only the native
     * ABI set differs.
     *
     * The 32-bit build necessarily omits the arm64-only closed-source prebuilts
     * (libgxcore, libinbuiltmods, libmaesdk, libPlayFabMultiplayer, libmtbinloader2). Every
     * load site already degrades gracefully: the gxcore bootstrap returns false and is
     * skipped, InbuiltModsNative.loadLibrary returns false, LibBindings' static init
     * swallows UnsatisfiedLinkError, and loadAllLibraries filters them out. The 32-bit build
     * therefore loses gxcore verification, the inbuilt mod menu and materialbin autofix, but
     * it launches 32-bit versions.
     */
    flavorDimensions += "abi"
    productFlavors {
        abi64 {
            dimension "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        abi32 {
            dimension "abi"
            ndk {
                // armeabi-v7a only. This must NOT also list arm64-v8a: see the note in
                // defaultConfig about ndk blocks being merged rather than overridden.
                abiFilters 'armeabi-v7a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        beta {
            initWith release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Chimera Launcher Beta"
            buildConfigField "boolean", "IS_BETA", "true"
            matchingFallbacks = ["release"]
            ndk {
                debugSymbolLevel 'FULL'
            }
        }

    }
    packagingOptions {
        jniLibs.useLegacyPackaging = true
        doNotStrip "**/*.so"
        resources.excludes += [
                "DebugProbesKt.bin"
        ]

        resources.pickFirsts += [
                "META-INF/INDEX.LIST",
                "META-INF/DEPENDENCIES",
                "META-INF/io.netty.versions.properties"
        ]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "28.2.13676358"
}

