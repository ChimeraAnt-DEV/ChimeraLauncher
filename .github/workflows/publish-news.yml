name: Publish launcher news

on:
  push:
    branches:
      - main
    paths:
      - resources/launcher/news.json
      - scripts/prepare_news_notification.py
      - scripts/validate_release_content.py
      - .github/workflows/publish-news.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-launcher-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history so the previous news.json can be recovered from any pushed commit.
          fetch-depth: 0

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Find the newly published item
        id: news
        env:
          # The tip of the branch before this push. Empty for workflow_dispatch.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          previous_file="${RUNNER_TEMP}/previous-news.json"
          message_file="${RUNNER_TEMP}/news-message.json"
          # Compare against the state before this push. Falling back to HEAD^ keeps
          # workflow_dispatch working, and an empty feed keeps the first-ever run working.
          base="${BEFORE_SHA}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          if ! git show "${base}:resources/launcher/news.json" > "$previous_file" 2>/dev/null; then
            printf '{"schemaVersion":1,"items":[]}' > "$previous_file"
          fi
          python3 scripts/prepare_news_notification.py \
            resources/launcher/news.json \
            "$previous_file" \
            "$message_file" \
            "$GITHUB_OUTPUT"
          echo "message_file=$message_file" >> "$GITHUB_OUTPUT"

      - name: Check Firebase sender configuration
        id: firebase
        if: steps.news.outputs.should_send == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            project_id=$(python3 -c 'import json, os; print(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])["project_id"])')
            echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::News was published, but FCM push was skipped because FIREBASE_SERVICE_ACCOUNT_JSON is not configured."
          fi

      - name: Authenticate to Firebase
        id: auth
        if: steps.news.outputs.should_send == 'true' && steps.firebase.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 600s

      - name: Send the news notification
        if: steps.news.outputs.should_send == 'true' && steps.firebase.outputs.enabled == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ steps.firebase.outputs.project_id }}
          MESSAGE_FILE: ${{ steps.news.outputs.message_file }}
        run: |
          request_file="${RUNNER_TEMP}/fcm-request.json"
          python3 - "$MESSAGE_FILE" "$request_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              item = json.load(source)
          data = {
              "news_id": item["id"],
              "title": "New Version Available",
              "summary": "Please check https://github.com/ChimeraAnt-DEV/ChimeraLauncher/releases to download!",
              "published_at": item["publishedAt"],
              "url": item.get("url", ""),
          }
          request = {
              "message": {
                  "topic": "chimeralauncher-news",
                  "data": data,
                  "android": {"priority": "high", "ttl": "86400s"},
              }
          }
          with open(sys.argv[2], "w", encoding="utf-8") as destination:
              json.dump(request, destination)
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; UTF-8" \
            --data-binary "@$request_file" \
            "https://fcm.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/messages:send"

      - name: Summarize the result
        if: always()
        env:
          SHOULD_SEND: ${{ steps.news.outputs.should_send }}
          FCM_ENABLED: ${{ steps.firebase.outputs.enabled }}
        run: |
          {
            echo "### Launcher news"
            echo ""
            if [ "${SHOULD_SEND}" = "true" ] && [ "${FCM_ENABLED}" = "true" ]; then
              echo "Published a new item and sent the push notification."
            elif [ "${SHOULD_SEND}" = "true" ]; then
              echo "Published a new item, but the push notification was skipped."
              echo "Add the \`FIREBASE_SERVICE_ACCOUNT_JSON\` secret to enable push."
            else
              echo "No new notifiable item in this push; nothing was sent."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
